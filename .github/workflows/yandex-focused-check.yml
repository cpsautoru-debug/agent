name: Yandex finance focused check
on:
  push:
    branches:
      - feature/marketplace-agents-staging
    paths:
      - 'functions/api/yandex/**'
      - 'web/office/yandex-*.mjs'
      - 'web/office/ceo-dashboard.mjs'
      - 'web/office/business-pnl.mjs'
      - 'web/office/wb-management-profit.mjs'
      - 'web/office/consolidated-pnl-core.mjs'
      - 'web/office/ozon-provisional-profit.mjs'
      - 'web/office/office-source-registry.mjs'
      - 'web/office/index.html'
      - 'tests/office/ceo-dashboard.test.mjs'
      - 'tests/finance/yandex-*.test.mjs'
      - 'tests/yandex-orders-preview.test.mjs'
      - 'tests/finance/consolidated-pnl.test.mjs'
      - 'tests/finance/ozon-provisional-profit.test.mjs'
      - 'tests/finance/wb-owner-cost-reconciliation.test.mjs'
      - '.github/workflows/yandex-focused-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  yandex-finance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit three marketplace finance modules
        run: node --test tests/finance/yandex-*.test.mjs tests/finance/consolidated-pnl.test.mjs tests/finance/ozon-provisional-profit.test.mjs tests/finance/wb-owner-cost-reconciliation.test.mjs tests/office/ceo-dashboard.test.mjs tests/finance/business-pnl-source-evidence.test.mjs

  yandex-order-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify read-only, paginated two-shop order preview
        run: node --test tests/yandex-orders-preview.test.mjs
