name: Persistent order queue safety checks
on:
  push:
    branches: [office-38-staff-access-foundation, office-37-staff-readable-status, office-35-staff-visual-preview, office-34-staff-preview, office-33-staff-role-foundation, office-32-operational-view-safety, office-31-manual-audit-and-demand-safety, office-30-wb-yandex-snapshot-audit, office-29-order-audit-integration, office-27-manual-demand, office-26-manual-cohort-guard, office-24-operational-queue, feature/marketplace-agents-staging, office-21-stage9-freshness, office-21-stage9-batch-sku, office-21-sewing-demand, office-21-demand-priority, office-21-sewing-supervisor, office-21-picking-preview, office-21-wb-capacity]
    paths:
      - 'functions/api/auth/staff-session.mjs'
      - 'migrations/20261128_staff_access.sql'
      - 'functions/api/orders/staff-projection.mjs'
      - 'functions/api/orders/staff-preview.js'
      - 'functions/api/orders/persistent-queue.js'
      - 'functions/api/orders/source-snapshot-audit.js'
      - 'tests/source-snapshot-audit.test.mjs'
      - 'functions/api/orders/order-buckets.js'
      - 'functions/api/orders/ozon-open-audit.js'
      - 'tests/ozon-open-audit.test.mjs'
      - 'functions/api/orders/warehouse-route-approval.js'
      - 'web/office/warehouse-route-approval.mjs'
      - 'web/office/saved-sku-confirmation.mjs'
      - 'web/office/approved-sku-stock-diagnostic.mjs'
      - 'functions/api/ms/approved-sku-stock-current.js'
      - 'tests/approved-sku-stock-current.test.mjs'
      - 'tests/warehouse-route-approval.test.mjs tests/approved-sku-stock-current.test.mjs'
      - 'functions/api/orders/workflow-review.js'
      - 'functions/api/orders/order-stock-precheck.js'
      - 'functions/api/orders/order-availability.js'
      - 'functions/api/orders/fulfillment-*.mjs'
      - 'tests/fulfillment-*.test.mjs'
      - 'migrations/20261125_order_warehouse.sql'
      - 'migrations/20261125_order_fulfillment.sql'
      - 'tests/order-stock-precheck.test.mjs'
      - 'migrations/20261125_order_workflow_review.sql'
      - 'tests/order-workflow-review.test.mjs'
      - 'web/office/persistent-order-queue.mjs'
      - 'web/office/staff-preview.mjs'
      - 'web/office/index.html'
      - 'web/office/sewing-demand.mjs'
      - 'migrations/20261125_persistent_order_queue.sql'
      - 'tests/persistent-order-queue.test.mjs'
      - '.github/workflows/persistent-order-queue-tests.yml'
  pull_request:
    branches: [feature/marketplace-agents-staging]
    paths:
      - 'functions/api/auth/staff-session.mjs'
      - 'tests/fulfillment-staff-session.test.mjs'
      - 'web/office/staff-preview.mjs'
      - 'tests/fulfillment-staff-preview-ui.test.mjs'
      - '.github/workflows/persistent-order-queue-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate D1 mirror and trusted-source boundaries
        run: node --test tests/source-snapshot-audit.test.mjs tests/ozon-open-audit.test.mjs tests/ozon-unfulfilled-audit.test.mjs tests/persistent-order-queue.test.mjs tests/order-workflow-review.test.mjs tests/order-stock-precheck.test.mjs tests/fulfillment-*.test.mjs tests/warehouse-route-approval.test.mjs
      - name: Check browser queue syntax
        run: node --check web/office/staff-preview.mjs && node --check web/office/sewing-demand.mjs && node --check web/office/persistent-order-queue.mjs && node --check web/office/warehouse-route-approval.mjs && node --check web/office/saved-sku-confirmation.mjs && node --check web/office/approved-sku-stock-diagnostic.mjs
