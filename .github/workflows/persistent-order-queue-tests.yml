name: Persistent order queue safety checks
on:
  push:
    branches: [feature/marketplace-agents-staging, office-21-stage9-freshness, office-21-stage9-batch-sku]
    paths:
      - 'functions/api/orders/persistent-queue.js'
      - 'functions/api/orders/warehouse-route-approval.js'
      - 'web/office/warehouse-route-approval.mjs'
      - 'web/office/saved-sku-confirmation.mjs'
      - 'web/office/approved-sku-stock-diagnostic.mjs'
      - 'functions/api/ms/approved-sku-stock-current.js'
      - 'tests/approved-sku-stock-current.test.mjs'
      - 'tests/warehouse-route-approval.test.mjs tests/approved-sku-stock-current.test.mjs'
      - 'functions/api/orders/workflow-review.js'
      - 'functions/api/orders/order-stock-precheck.js'
      - 'functions/api/orders/order-availability.js'
      - 'functions/api/orders/fulfillment-*.mjs'
      - 'tests/fulfillment-*.test.mjs'
      - 'migrations/20261125_order_warehouse.sql'
      - 'migrations/20261125_order_fulfillment.sql'
      - 'tests/order-stock-precheck.test.mjs'
      - 'migrations/20261125_order_workflow_review.sql'
      - 'tests/order-workflow-review.test.mjs'
      - 'web/office/persistent-order-queue.mjs'
      - 'migrations/20261125_persistent_order_queue.sql'
      - 'tests/persistent-order-queue.test.mjs'
      - '.github/workflows/persistent-order-queue-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate D1 mirror and trusted-source boundaries
        run: node --test tests/persistent-order-queue.test.mjs tests/order-workflow-review.test.mjs tests/order-stock-precheck.test.mjs tests/fulfillment-*.test.mjs tests/warehouse-route-approval.test.mjs
      - name: Check browser queue syntax
        run: node --check web/office/persistent-order-queue.mjs && node --check web/office/warehouse-route-approval.mjs && node --check web/office/saved-sku-confirmation.mjs && node --check web/office/approved-sku-stock-diagnostic.mjs
