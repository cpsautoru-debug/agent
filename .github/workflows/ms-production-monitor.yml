name: MoySklad production monitor
on:
  pull_request:
    branches: [feature/marketplace-agents-staging]
    paths:
      - 'functions/api/ms/production-feed.js'
      - 'functions/api/ms/production-stages.js'
      - 'web/office/ms-production.js'
      - 'web/office/ms-production-date.mjs'
      - 'web/office/ms-production-plan-date.mjs'
      - 'web/office/ms-production-audit.mjs'
      - 'web/office/ms-production.css'
      - 'web/office/index.html'
      - 'tests/ms/ms-production-feed.test.mjs'
      - 'tests/ms/ms-production-interface.test.mjs'
      - 'tests/ms/ms-production-audit.test.mjs'
      - 'tests/ms/ms-production-audit-ui.test.mjs'
      - 'tests/ms/ms-production-stages.test.mjs'
      - 'tests/ms/ms-production-date.test.mjs'
      - 'tests/ms/ms-production-plan-date.test.mjs'
      - '.github/workflows/ms-production-monitor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check functions/api/ms/production-feed.js
      - run: node --check functions/api/ms/production-stages.js
      - run: node --check web/office/ms-production.js
      - run: node --check web/office/ms-production-audit.mjs
      - run: node --check web/office/ms-production-plan-date.mjs
      - run: node --test tests/ms/ms-production-feed.test.mjs tests/ms/ms-production-stages.test.mjs tests/ms/ms-production-date.test.mjs tests/ms/ms-production-plan-date.test.mjs tests/ms/ms-production-interface.test.mjs tests/ms/ms-production-audit.test.mjs tests/ms/ms-production-audit-ui.test.mjs
