name: WB paid acceptance reconciliation
on:
  push:
    branches:
      - feature/marketplace-agents-staging
    paths:
      - 'workers/wb-finance-sync-core.mjs'
      - 'workers/wb-finance-auto-sync.js'
      - 'tests/wb-paid-acceptance-reconcile.test.mjs'
      - '.github/workflows/wb-paid-acceptance-tests.yml'
  pull_request:
    paths:
      - 'workers/wb-finance-sync-core.mjs'
      - 'workers/wb-finance-auto-sync.js'
      - 'tests/wb-paid-acceptance-reconcile.test.mjs'
      - '.github/workflows/wb-paid-acceptance-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/wb-paid-acceptance-reconcile.test.mjs
