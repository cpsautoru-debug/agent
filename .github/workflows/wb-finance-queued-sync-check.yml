name: WB Finance queued sync check
on:
  pull_request:
    branches: [feature/marketplace-agents-staging]
    paths:
      - 'workers/wb-finance-sync-core.mjs'
      - 'workers/wb-finance-auto-sync.js'
      - 'functions/api/wb/auto-sync-status.js'
      - 'functions/api/wb/unit-economics.js'
      - 'functions/api/finance/cost-audit.js'
      - 'web/office/unified-cost-audit-core.mjs'
      - 'web/office/finance-cost-audit.mjs'
      - 'tests/wb/unified-cost-audit-core.test.mjs'
      - 'tests/wb/unified-cost-audit-api.test.mjs'
      - 'tests/wb/unified-cost-audit-ui.test.mjs'
      - 'functions/api/wb/unit-costs.js'
      - 'functions/api/wb/model-cost-batch.js'
      - 'web/office/wb-model-cost-bulk-core.mjs'
      - 'web/office/wb-model-cost-bulk-ui.mjs'
      - 'tests/wb/wb-model-cost-bulk-core.test.mjs'
      - 'tests/wb/wb-model-cost-bulk-api.test.mjs'
      - 'tests/wb/wb-model-cost-bulk-ui.test.mjs'
      - 'web/office/wb-unit-economics.js'
      - 'web/office/wb-cost-suggestions-core.mjs'
      - 'web/office/wb-model-group-core.mjs'
      - 'web/office/wb-model-group-ui.mjs'
      - 'tests/wb/wb-model-group-core.test.mjs'
      - 'tests/wb/wb-model-group-ui.test.mjs'
      - 'web/office/wb-cost-suggestions-ui.mjs'
      - 'tests/wb/wb-cost-suggestions-core.test.mjs'
      - 'tests/wb/wb-cost-suggestions-ui.test.mjs'
      - 'web/office/wb-unit-economics-core.mjs'
      - 'web/office/shared-overheads-core.mjs'
      - 'tests/wb/shared-overheads-core.test.mjs'
      - 'web/office/wb-unit-economics.css'
      - 'migrations/wb/0007_wb_profit_unit_costs.sql'
      - 'tests/wb/wb-unit-economics-core.test.mjs'
      - 'tests/wb/wb-unit-economics-api.test.mjs'
      - 'tests/wb/wb-unit-costs-api.test.mjs'
      - 'tests/wb/wb-unit-economics-ui.test.mjs'
      - 'web/office/wb-finance-monitor-core.mjs'
      - 'web/office/wb-auto-sync-status.js'
      - 'web/office/wb-finance-monitor.css'
      - 'web/office/index.html'
      - 'tests/wb/wb-finance-monitor-core.test.mjs'
      - 'tests/wb/wb-finance-monitor-api.test.mjs'
      - 'tests/wb/wb-finance-monitor-ui.test.mjs'
      - 'functions/api/wb/sync-once.js'
      - 'tests/wb/wb-owner-one-shot.test.mjs'
      - 'tests/wb/wb-finance-sync-core.test.mjs'
      - 'migrations/wb/0006_wb_finance_api_queued_sync.sql'
      - '.github/workflows/wb-finance-queued-sync-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wb-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check workers/wb-finance-auto-sync.js
      - run: node --check functions/api/wb/auto-sync-status.js
      - run: node --check functions/api/wb/unit-economics.js
      - run: node --check functions/api/finance/cost-audit.js
      - run: node --check web/office/unified-cost-audit-core.mjs
      - run: node --check web/office/finance-cost-audit.mjs
      - run: node --test tests/wb/unified-cost-audit-core.test.mjs tests/wb/unified-cost-audit-api.test.mjs tests/wb/unified-cost-audit-ui.test.mjs
      - run: node --check functions/api/wb/unit-costs.js
      - run: node --check functions/api/wb/model-cost-batch.js
      - run: node --check web/office/wb-model-cost-bulk-core.mjs
      - run: node --check web/office/wb-model-cost-bulk-ui.mjs
      - run: node --test tests/wb/wb-model-cost-bulk-core.test.mjs tests/wb/wb-model-cost-bulk-api.test.mjs tests/wb/wb-model-cost-bulk-ui.test.mjs
      - run: node --check web/office/wb-unit-economics.js
      - run: node --check web/office/wb-cost-suggestions-core.mjs
      - run: node --check web/office/wb-model-group-core.mjs
      - run: node --check web/office/wb-model-group-ui.mjs
      - run: node --test tests/wb/wb-model-group-core.test.mjs tests/wb/wb-model-group-ui.test.mjs
      - run: node --check web/office/wb-cost-suggestions-ui.mjs
      - run: node --test tests/wb/wb-cost-suggestions-core.test.mjs tests/wb/wb-cost-suggestions-ui.test.mjs
      - run: node --check web/office/wb-unit-economics-core.mjs
      - run: node --check web/office/shared-overheads-core.mjs
      - run: node --test tests/wb/shared-overheads-core.test.mjs
      - run: node --test tests/wb/wb-unit-economics-core.test.mjs tests/wb/wb-unit-economics-api.test.mjs tests/wb/wb-unit-costs-api.test.mjs tests/wb/wb-unit-economics-ui.test.mjs
      - run: node --check web/office/wb-finance-monitor-core.mjs
      - run: node --check functions/api/wb/sync-once.js
      - run: node --test tests/wb/wb-owner-one-shot.test.mjs
      - run: node --check web/office/wb-auto-sync-status.js
      - run: node --test tests/wb/wb-finance-monitor-core.test.mjs tests/wb/wb-finance-monitor-api.test.mjs tests/wb/wb-finance-monitor-ui.test.mjs
      - run: node --test tests/wb/wb-finance-sync-core.test.mjs
      - name: Verify staging schema on a fresh SQLite database
        run: |
          python3 - <<'PY'
          import sqlite3
          con = sqlite3.connect(':memory:')
          with open('migrations/wb/0006_wb_finance_api_queued_sync.sql',encoding='utf-8') as f:
              con.executescript(f.read())
          got = {x[0] for x in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required={'wb_finance_api_runtime','wb_finance_api_reports','wb_finance_api_rows'}
          assert required <= got, (required, got)
          assert 'wb_saved_xlsx_reports' not in got
          with open('migrations/wb/0007_wb_profit_unit_costs.sql',encoding='utf-8') as f:
              con.executescript(f.read())
          assert 'wb_profit_unit_costs' in {
              x[0] for x in con.execute("SELECT name FROM sqlite_master WHERE type='table'")
          }
          # Database guarantee: a confirmed dated cost cannot silently change
          con.execute("INSERT INTO wb_profit_unit_costs (account_id,vendor_code,valid_from,valid_to,cost_kopecks,status,source,actor) VALUES (?,?,?,?,?,?,?,?)",
                      ('4271851','VESTA','2026-10-01',None,420000,'confirmed','verified production card','owner'))
          try:
              con.execute("UPDATE wb_profit_unit_costs SET cost_kopecks=2 WHERE vendor_code='VESTA'")
              assert False, 'mutating confirmed COGS must be rejected'
          except sqlite3.IntegrityError:
              pass
          print('Staging API-only tables OK')
          PY
