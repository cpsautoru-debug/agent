name: Ozon Finance source audit
on:
  push:
    branches: [feature/marketplace-agents-staging]
    paths:
      - 'functions/api/ozon/finance-readiness.js'
      - 'functions/api/ozon/finance-readiness.test.mjs'
      - 'functions/api/ozon/daily-parity.js'
      - 'functions/api/ozon/daily-parity.test.mjs'
      - 'functions/api/ozon/ads-expense.js'
      - 'functions/api/ozon/ads-expense.test.mjs'
      - 'functions/api/ozon/profit.js'
      - 'functions/api/ozon/profit-model.js'
      - '.github/workflows/ozon-finance-readiness-tests.yml'
  pull_request:
    paths:
      - 'functions/api/ozon/finance-readiness.js'
      - 'functions/api/ozon/finance-readiness.test.mjs'
      - 'functions/api/ozon/daily-parity.js'
      - 'functions/api/ozon/daily-parity.test.mjs'
      - 'functions/api/ozon/ads-expense.js'
      - 'functions/api/ozon/ads-expense.test.mjs'
      - 'functions/api/ozon/profit.js'
      - 'functions/api/ozon/profit-model.js'
      - '.github/workflows/ozon-finance-readiness-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test functions/api/ozon/finance-readiness.test.mjs functions/api/ozon/daily-parity.test.mjs functions/api/ozon/ads-expense.test.mjs
