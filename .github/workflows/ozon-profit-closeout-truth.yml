name: Ozon Financial Closeout Truth Checks
on:
  push:
    branches:
      - fix/ozon-profit-closeout-truth-20261122
  pull_request:
    paths:
      - 'functions/api/ozon/profit-model.js'
      - 'web/office/profit.js'
      - 'web/office/index.html'
      - 'tests/ozon/profit-closeout-evidence.test.mjs'
      - 'tests/ozon/profit-model.test.mjs'
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finance closeout and Ozon Profit regression suite
        run: node --test tests/ozon/profit-closeout-evidence.test.mjs tests/ozon/profit-model.test.mjs tests/ozon/profit-ui.test.mjs tests/ozon/profit-date-cost-evidence.test.mjs tests/ozon/profit-ad-overlap.test.mjs tests/ozon/sku-cost-evidence.test.mjs
