name: Check Instagram service
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/instagram-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test.mjs cloud/test.mjs cloud/max.test.mjs
      - run: node --test ../max-agent/test.mjs ../max-agent/bridge.test.mjs ../max-agent/vk.test.mjs ../max-agent/moysklad.test.mjs ../max-agent/moysklad-reconcile.test.mjs ../max-agent/readiness.test.mjs ../max-agent/audit-ledger.test.mjs
      - run: node --test ../sheets-agents/test.mjs
      - run: node --test ../max-agent/vk-office.test.mjs ../vk-office/worker.test.mjs
