name: MS Production Recent Updates Check
on:
  push:
    branches:
      - feature/ms-production-recent-updates-20261122
  pull_request:
    paths:
      - 'web/office/ms-production.js'
      - 'web/office/index.html'
      - 'functions/api/ms/production-feed.js'
      - 'tests/ms/ms-production-*.test.mjs'
      - '.github/workflows/ms-production-recent-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify read-only task listing
        run: node --test tests/ms/ms-production-recent-updates.test.mjs tests/ms/ms-production-feed.test.mjs
