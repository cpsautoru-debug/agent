name: WB Payout Evidence Check
on:
  push:
    branches:
      - feature/wb-payout-provenance-20261122
  pull_request:
    paths:
      - 'web/office/wb-payout-provenance-*.mjs'
      - 'tests/wb/wb-payout-provenance.test.mjs'
      - '.github/workflows/wb-payout-evidence-check.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/wb/wb-payout-provenance.test.mjs
