name: Marketplace order intake focused checks
on:
  push:
    branches: [feature/marketplace-agents-staging]
    paths:
      - 'functions/api/marketplace/order-import-preview.js'
      - 'functions/api/yandex/orders-preview.js'
      - 'functions/api/ms/order-sku-links.js'
      - 'functions/api/ms/orders-stock-match.js'
      - 'web/office/orders-intake-board.mjs'
      - 'web/office/index.html'
      - 'tests/marketplace-order-import-preview.test.mjs'
      - 'tests/yandex-orders-preview.test.mjs'
      - 'tests/ms-order-sku-links.test.mjs'
      - 'tests/ms-orders-stock-match.test.mjs'
      - 'migrations/20261125_order_sku_links.sql'
      - '.github/workflows/order-intake-check.yml'
  pull_request:
    branches: [feature/marketplace-agents-staging]
    paths:
      - 'functions/api/marketplace/order-import-preview.js'
      - 'functions/api/yandex/orders-preview.js'
      - 'functions/api/ms/order-sku-links.js'
      - 'functions/api/ms/orders-stock-match.js'
      - 'web/office/orders-intake-board.mjs'
      - 'web/office/index.html'
      - 'tests/marketplace-order-import-preview.test.mjs'
      - 'tests/yandex-orders-preview.test.mjs'
      - 'tests/ms-order-sku-links.test.mjs'
      - 'tests/ms-orders-stock-match.test.mjs'
      - 'migrations/20261125_order_sku_links.sql'
      - '.github/workflows/order-intake-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  order-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify order intake, SKU mapping, pagination and read-only boundary
        run: node --test tests/marketplace-order-import-preview.test.mjs tests/yandex-orders-preview.test.mjs tests/ms-order-sku-links.test.mjs tests/ms-orders-stock-match.test.mjs
