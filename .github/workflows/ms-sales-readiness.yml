name: MoySklad sales preflight
on:
  pull_request:
    paths:
      - 'functions/api/orders/ms-sales-readiness.js'
      - 'tests/ms-sales-readiness.test.mjs'
      - '.github/workflows/ms-sales-readiness.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ms-sales-readiness.test.mjs
