name: Filtered occupancy checks
on:
  push:
    branches: [office-25-first-review-fairness, office-22-filtered-occupancy, feature/marketplace-agents-staging]
    paths: ['functions/api/orders/scheduled-fulfillment.js', 'tests/scheduled-fulfillment.test.mjs', 'functions/api/orders/fulfillment-occupancy.mjs', 'functions/api/orders/order-stock-precheck.js', 'tests/fulfillment-occupancy.test.mjs', '.github/workflows/filtered-occupancy.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/fulfillment-occupancy.test.mjs tests/fulfillment-production.test.mjs tests/fulfillment-checkpoint.test.mjs tests/order-stock-precheck.test.mjs tests/scheduled-fulfillment.test.mjs
