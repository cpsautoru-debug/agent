name: Задача агенту
description: Результат для одного отдела
body:
  - type: dropdown
    id: department
    attributes:
      label: Отдел
      options:
        - Управление
        - Маркетинг
        - Продажи
        - Дизайн
        - Финансы
        - Склад
        - Разработка
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Ответственная роль
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Задача и входные данные
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Ожидаемый результат и критерий готовности
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Срок и приоритет
